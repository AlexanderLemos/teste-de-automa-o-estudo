[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: Testes unitários (isolados, sem dependência externa)
    integration: Testes de integração (testam a API completa)
    parametrize: Testes parametrizados com múltiplos cenários
